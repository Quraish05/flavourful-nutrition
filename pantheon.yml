# Pantheon platform settings for the-cookbook.
# The first push replaces Pantheon's starter repo, including its
# pantheon.upstream.yml, so the values that file set are carried here.
api_version: 1

# Serve from web/ (the only nested docroot name Pantheon supports).
web_docroot: true

php_version: 8.3
database:
  version: 10.6

# Integrated Composer: Pantheon runs `composer install` on every push, so
# vendor/, core and contrib stay gitignored.
build_step: true

enforce_https: transitional
protected_web_paths:
  - /private/
  - /sites/default/files/private/
  - /sites/default/files/config/
