$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Method steps
status: stable
description: >-
  Molecule — the numbered method. An <ol>, so the order is carried by the
  markup and a screen reader announces "1 of 6" without help.

  The design numbers steps in roman numerals. Those are drawn with a CSS
  counter rather than written into the text, so the underlying list stays a
  plain ordered list — copy-paste, reader modes and print all still see 1, 2, 3.
props:
  type: object
  required: [steps]
  properties:
    steps:
      type: array
      title: Steps
      description: 'The method, one step per item. May contain inline markup.'
      items:
        type: string
    numeral:
      type: string
      title: Numeral style
      description: >-
        `roman` is the design's default; `decimal` suits a long method, where
        roman numerals stop being scannable past about eight steps. Either way
        the numeral is a CSS counter on ::before, so assistive tech announces
        the list's own ordinal rather than reading "III" as three letters.
      enum: [roman, decimal]
      default: roman
