$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Recipe card
status: stable
description: >-
  Molecule — a recipe summary card. Takes typed props for its scalar data and
  free-form slots for its media and tag areas (the latter holds tag-pill atoms).

  Three variants cover every card in the design, because they differ in
  proportion rather than in content: `compact` is the square-thumbnail row of
  the "Recently added" grid, `stacked` is a wider card with a 3:2 image, and
  `list` drops the image entirely for a text-only row.
props:
  type: object
  required: [title, url, heading_level]
  properties:
    title:
      type: string
      title: Title
    url:
      type: string
      title: URL
      description: 'Canonical link to the recipe.'
    eyebrow:
      type: string
      title: Eyebrow
      description: 'Small label above the title, e.g. the cuisine or course.'
    summary:
      type: string
      title: Summary
      description: 'Short teaser copy, clamped to 2 lines in the stacked variant.'
    meta:
      type: array
      title: Meta items
      description: >-
        The byline row — chef, time, servings. Passed to the meta-list atom, so
        supply a `label` on any value that is not self-describing.
      items:
        type: object
        required: [value]
        properties:
          label:
            type: string
          value:
            type: string
          url:
            type: string
    heading_level:
      type: integer
      title: Heading level
      description: >-
        Level for the card title. Pass the level the host context needs, not a
        constant: 2 directly under a page h1, 3 under an h2 section. Pass 0 to
        render the title without a heading wrapper at all, for contexts where an
        h1 already names the same recipe.
      enum: [0, 2, 3, 4, 5, 6]
    difficulty:
      type: string
      title: Difficulty
      description: >-
        Renders a small ruled badge. Constrained to the field_difficulty values
        so a typo fails at render rather than styling silently to nothing.
      enum: [easy, medium, hard, expert]
    variant:
      type: string
      title: Variant
      enum: [compact, stacked, list]
      default: compact
slots:
  media:
    title: Media
    description: 'Hero image (a rendered image field) or a placeholder.'
  tags:
    title: Tags
    description: 'Dietary/cuisine pills — fill with tag-pill atoms.'
