# -----------------------------------------------------------------------------
# Custom theme libraries (compiled from scss/ via `npm run build`).
# Import these into Twig with {{ attach_library('flavourful/<name>') }} or, for
# site-wide CSS, via the `libraries:` key in flavourful.info.yml.
# -----------------------------------------------------------------------------

# Site-wide base styling: design tokens, typography and page layout.
# Attached globally from flavourful.info.yml.
global-styling:
  version: VERSION
  css:
    base:
      css/global.css: {}

# Recipes listing + recipe card styling. Attached on demand from the recipes
# View templates so its CSS only loads on pages that render recipe cards.
recipes:
  version: VERSION
  css:
    component:
      css/recipes.css: {}

recipe-interactions:
  version: 1.x
  js:
    js/recipe-interactions.js: {}
  dependencies:
    - core/drupal # gives you Drupal.behaviors
    - core/once # gives you once()
    - core/drupalSettings

# Behaviour for the recipe-tools component: the servings scaler and Cook Mode.
# JS only — the component's CSS lives beside its Twig in
# components/recipe-tools/recipe-tools.css and SDC attaches it on render.
# Nothing needs to attach this library by hand either: the component declares it
# as a dependency in its .component.yml, so placing the component brings the
# behaviour with it.
recipe-tools:
  version: 1.x
  js:
    js/recipe-tools.js: {}
  dependencies:
    - core/drupal # Drupal.behaviors + Drupal.t
    - core/once

# An intentionally empty library.
#
# Olivero's own `libraries-extend` is inherited by this theme, and it bolts
# Olivero CSS onto core libraries wherever they are attached — the AJAX glossary
# view, for instance, pulled in olivero/drupal.message and olivero/progress.
# There is no way to un-extend an inherited key.
#
# Setting those libraries to `false` in libraries-override is not the answer:
# the inherited libraries-extend still names them, and Drupal then throws
# InvalidLibrariesExtendSpecificationException on every page. They have to keep
# existing while carrying nothing, which is what this redirects them to.
# A library needs at least one of css / js / drupalSettings / dependencies to be
# a valid definition, so it declares an empty dependency list — the only one of
# the four that adds nothing at all to the page.
noop:
  version: VERSION
  dependencies: {  }

# Structural CSS inherited from the starterkit, for markup this theme does not
# own: forms, field wrappers, file/tabledrag widgets, dialogs.
#
# Six files were removed when the theme was redesigned — breadcrumb, menu, tabs,
# pager, links and more-link. Each of them is now styled in
# scss/layout/_page.scss, and leaving them loaded actively broke the dark
# palette: they load in the `component` group, which comes *after* the `base`
# group that global.css sits in, so they won on equal specificity. Worse,
# `ul.menu a.is-active { color: #000 }` is *higher* specificity than the theme's
# own rule, which rendered the active nav item black on a near-black ground.
# Do not add them back without checking both of those things.
base:
  version: VERSION
  css:
    component:
      css/components/action-links.css:
        weight: -10
      css/components/button.css:
        weight: -10
      css/components/container-inline.css:
        weight: -10
      css/components/details.css:
        weight: -10
      css/components/exposed-filters.css:
        weight: -10
      css/components/field.css:
        weight: -10
      css/components/form.css:
        weight: -10
      css/components/icons.css:
        weight: -10
      css/components/inline-form.css:
        weight: -10
      css/components/link.css:
        weight: -10
      css/components/tabledrag.css:
        weight: -10
      css/components/tableselect.css:
        weight: -10
      css/components/textarea.css:
        weight: -10
      css/components/ui-dialog.css:
        weight: -10
dialog:
  version: VERSION
  css:
    component:
      css/components/dialog.css:
        weight: -10
dropbutton:
  version: VERSION
  css:
    component:
      css/components/dropbutton.css:
        weight: -10
file:
  version: VERSION
  css:
    component:
      css/components/file.css:
        weight: -10
image-widget:
  version: VERSION
  css:
    component:
      css/components/image-widget.css: {}
indented:
  version: VERSION
  css:
    component:
      css/components/indented.css: {}
messages:
  version: VERSION
  css:
    component:
      css/components/messages.css:
        weight: -10
node:
  version: VERSION
  css:
    component:
      css/components/node.css:
        weight: -10
progress:
  version: VERSION
  css:
    component:
      css/components/progress.css:
        weight: -10
drupal.tablesort:
  version: VERSION
  css:
    component:
      css/components/tablesort.css:
        weight: -10
item-list:
  version: VERSION
  css:
    component:
      css/components/item-list.css:
        weight: -10
search-results:
  version: VERSION
  css:
    component:
      css/components/search-results.css: {}
user:
  version: VERSION
  css:
    component:
      css/components/user.css:
        weight: -10

# Adds the disclosure state to the facet soft-limit toggle, which
# facets/soft-limit builds in JS without one. Never attached by hand — it is
# bolted onto facets/soft-limit via libraries-extend in flavourful.info.yml,
# so it loads only on pages that actually render a soft-limited facet, and
# always after the script whose markup it is fixing.
facet-soft-limit:
  version: 1.x
  js:
    js/facet-soft-limit.js: {}
  dependencies:
    - core/drupal
    - core/once

